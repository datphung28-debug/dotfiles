customCommands:
  - key: "C"
    command: "git cz"
    description: "commit with commitizen"
    context: "files"
    loadingText: "opening commitizen commit tool"
    output: terminal
git:
  autoFetch: false
  diffRenderers:
    - command: delta --dark --syntax-theme="Solarized (dark)" --paging=never

# >>> serpantinum theme >>>
gui:
  mouseEvents: false
  scrollHeight: 30
  theme:
    activeBorderColor:
      - "#fbb974"
      - bold
    inactiveBorderColor:
      - "#9d8e81"
    searchingActiveBorderColor:
      - "#bfcc9b"
      - bold
    optionsTextColor:
      - "#e1c1a3"
    selectedLineBgColor:
      - "#303030"
    inactiveViewSelectedLineBgColor:
      - "#211a14"
    cherryPickedCommitFgColor:
      - "#2a3411"
    cherryPickedCommitBgColor:
      - "#bfcc9b"
    markedBaseCommitFgColor:
      - "#402c18"
    markedBaseCommitBgColor:
      - "#e1c1a3"
    unstagedChangesColor:
      - "#ffb4ab"
    defaultFgColor:
      - "#eee0d5"
# <<< serpantinum theme <<<
