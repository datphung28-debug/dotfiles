customCommands:
  - key: "C"
    command: "git cz"
    description: "commit with commitizen"
    context: "files"
    loadingText: "opening commitizen commit tool"
    output: terminal
git:
  autoFetch: false
  diffRenderers:
    - command: delta --dark --syntax-theme="Solarized (dark)" --paging=never

# >>> serpantinum theme >>>
gui:
  mouseEvents: false
  scrollHeight: 30
  theme:
    activeBorderColor:
      - "#f7bb70"
      - bold
    inactiveBorderColor:
      - "#9c8e80"
    searchingActiveBorderColor:
      - "#bacd9f"
      - bold
    optionsTextColor:
      - "#dec2a2"
    selectedLineBgColor:
      - "#303030"
    inactiveViewSelectedLineBgColor:
      - "#211a13"
    cherryPickedCommitFgColor:
      - "#263514"
    cherryPickedCommitBgColor:
      - "#bacd9f"
    markedBaseCommitFgColor:
      - "#3f2d17"
    markedBaseCommitBgColor:
      - "#dec2a2"
    unstagedChangesColor:
      - "#ffb4ab"
    defaultFgColor:
      - "#eee0d4"
# <<< serpantinum theme <<<
