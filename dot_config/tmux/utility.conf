# Display lazygit
bind -r g display-popup -d '#{pane_current_path}' -w90% -h90% -E lazygit

bind -r y run-shell '\
  SESSION="popup-$(echo #{pane_current_path} | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}"; \
  tmux display-popup -w80% -h80% -E "tmux attach-session -t $SESSION"'
