# vim: ft=tmux
# Màu cho tam giác notch đầu mỗi window (tmux không có foreground trong suốt,
# nên phải dùng màu đặc; đặt trùng màu nền terminal để trông như transparent).
set -g @statusline_notch_bg "#000000"
set -g mode-style "fg=#eee8d5,bg=#073642"

set -g message-style "fg=#eee8d5,bg=#073642"
set -g message-command-style "fg=#eee8d5,bg=#073642"

set -g pane-border-style "fg=#073642"
set -g pane-active-border-style "fg=#eee8d5"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"


set -g status-style fg=#586e75,bg=default

set -g status-bg "default"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#eee8d5,bg=default]#[fg=#073642,bg=#eee8d5,bold] #S:#I.#P #[fg=#eee8d5,bg=#93a1a1,nobold,nounderscore,noitalics]#[fg=#15161E,bg=#93a1a1,bold] #(whoami) #[fg=#93a1a1,bg=default]"
set -g status-right "#[fg=#586e75,bg=default,nobold,nounderscore,noitalics]#[fg=#93a1a1,bg=#586e75]#[fg=#657b83,bg=#586e75,nobold,nounderscore,noitalics]#[fg=#93a1a1,bg=#657b83]#[fg=#93a1a1,bg=#657b83,nobold,nounderscore,noitalics]#[fg=#15161E,bg=#93a1a1,bold] #h "

setw -g window-status-activity-style "underscore,fg=#839496,bg=default"
setw -g window-status-bell-style "default"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#839496,bg=default"
setw -g window-status-format '#[fg=#{@statusline_notch_bg},bg=#{?window_bell_flag,##D33682,#b58900}]#[fg=#{?window_bell_flag,#eee8d5,#00141A},bg=#{?window_bell_flag,##D33682,#b58900},#{?window_bell_flag,bold,nobold}] #I #[fg=#{?window_bell_flag,##D33682,#b58900},bg=#93a1a1]#[fg=#00141A,bg=#93a1a1] #{b:pane_current_path} #[fg=#93a1a1,bg=default,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#{@statusline_notch_bg},bg=#{?window_bell_flag,##D33682,#278BD3}]#[fg=#eee8d5,bg=#{?window_bell_flag,##D33682,#278BD3},bold] #I #[fg=#{?window_bell_flag,##D33682,#278BD3},bg=#eee8d5]#[fg=#00141A,bg=#eee8d5,bold] #{b:pane_current_path} #[fg=#eee8d5,bg=default,nobold,nounderscore,noitalics]'
