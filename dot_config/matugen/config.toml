[config]
prefer = "saturation"


[templates.quickshell]
input_path = "~/.config/matugen/templates/qs_colors.json.template"
output_path = "~/.config/matugen/generated/qs_colors.json"
post_hook = '''
  cp -f "$HOME/.config/matugen/generated/qs_colors.json" /tmp/qs_colors.json 2>/dev/null || :
'''

[templates.pywalfox]
input_path = "~/.config/matugen/templates/pywalfox-colors.json"
output_path = "~/.cache/wal/colors.json"
post_hook = '''
  command -v pywalfox >/dev/null 2>&1 && pywalfox update || :
'''

[templates.icon_theme]
input_path  = '/dev/null'
output_path = '/dev/null'
post_hook   = '''
   gsettings set org.gnome.desktop.interface icon-theme "Papirus-White" || :
'''

[templates.hyprland]
input_path  = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/matugen/generated/hyprland-colors.lua'
post_hook   = 'hyprctl reload config-only || :'

[templates.swayosd]
input_path = '~/.config/matugen/templates/swayosd.css.template'
output_path = '~/.config/matugen/generated/swayosd.css'
post_hook = '''
  mkdir -p "$HOME/.config/swayosd"
  ln -nfs "$HOME/.config/matugen/generated/swayosd.css" "$HOME/.config/swayosd/style.css"
  bash -lc 'systemctl --user try-restart swayosd.service 2>/dev/null || { pgrep -x swayosd-server >/dev/null && pkill -x swayosd-server && nohup swayosd-server >/dev/null 2>&1 & } || true'
'''

[templates.kvantum_kvconfig]
input_path  = '~/.config/matugen/templates/kvantum-colors.kvconfig'
output_path = '~/.config/matugen/generated/kvantum-matugen.kvconfig'
post_hook   = '''
  ln -nfs "$HOME/.config/matugen/generated/kvantum-matugen.kvconfig" "$HOME/.config/Kvantum/matugen/matugen.kvconfig"
'''

[templates.kvantum_svg]
input_path  = '~/.config/matugen/templates/kvantum-colors.svg'
output_path = '~/.config/matugen/generated/kvantum-matugen.svg'
post_hook   = '''
  ln -nfs "$HOME/.config/matugen/generated/kvantum-matugen.svg" "$HOME/.config/Kvantum/matugen/matugen.svg"
'''
