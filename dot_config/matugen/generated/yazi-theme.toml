# : Manager [[[

[mgr]
cwd = { fg = "#ffffff" }

# Find
find_keyword  = { fg = "#a0a0a0", bold = true, italic = true, underline = true }
find_position = { fg = "#a0a0a0", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#adadad", bg = "#adadad" }
marker_cut      = { fg = "#e0e0e0", bg = "#e0e0e0" }
marker_marked   = { fg = "#a0a0a0", bg = "#a0a0a0" }
marker_selected = { fg = "#cccccc", bg = "#cccccc" }

# Count
count_copied   = { fg = "#000000", bg = "#e0e0e0" }
count_cut      = { fg = "#000000", bg = "#e0e0e0" }
count_selected = { fg = "#000000", bg = "#cccccc" }

# Border
border_symbol = "│"
border_style  = { fg = "#ffffff" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#ffffff", bold = true, bg = "#000000" }
inactive  = { fg = "#ffffff", bg = "#000000" }
sep_inner = { open = "[", close = "]" }
sep_outer = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#ffffff", fg = "#000000", bold = true }
normal_alt  = { bg = "#2a2a2a", fg = "#a0a0a0" }

# Select mode
select_main = { bg = "#ffffff", fg = "#000000", bold = true }
select_alt  = { bg = "#2a2a2a", fg = "#a0a0a0" }

# Unset mode
unset_main = { bg = "#cccccc", fg = "#000000", bold = true }
unset_alt  = { bg = "#2a2a2a", fg = "#a0a0a0" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "🭁", close = "🭠" }
sep_right = { open = "🭁", close = "🭠" }

# Permissions
perm_type  = { fg = "#b3b3b3" }
perm_write = { fg = "#808080" }
perm_read  = { fg = "#545454" }
perm_exec  = { fg = "#949494" }
perm_sep   = { fg = "#949494" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#ffffff", bg = "#3a3a3a" }
progress_error  = { fg = "#a0a0a0", bg = "#3a3a3a" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = {}
border = { fg = "#ffffff" }
cand = { fg = "#ffffff" }
rest = { fg = "#a0a0a0" }
desc = { fg = "#ffffff" }
separator = " ▶ "
separator_style = { fg = "#ffffff" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#cccccc" }
title_warn  = { fg = "#ffffff" }
title_error = { fg = "#a0a0a0" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#ffffff" }
active = { fg = "#cccccc", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#ffffff" }
title = { fg = "#ffffff" }
value  = { fg = "#ffffff" }
selected = { bg = "#e0e0e0", fg = "#000000" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#ffffff", bg = "#000000" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#ffffff" }
title   = {}
hovered = { fg = "#e0e0e0", underline = true }

# : ]]]


# : Confirm [[[

[confirm]
border = { fg = "#ffffff" }
title  = { fg = "#ffffff" }

# : ]]]


# : Spot [[[

[spot]
border  = { fg = "#ffffff" }
title   = { fg = "#ffffff" }
tbl_col = { fg = "#ffffff" }

# : ]]]


# : Help [[[

[help]
border  = { fg = "#ffffff" }
chord   = { fg = "#ffffff" }
action  = {}
hovered = { reversed = true, bold = true }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { url = "*", is = "orphan", bg = "#808080" },
    { url = "*", is = "exec", fg = "#000000" },

    # Fallback
    { url = "*", fg = "#ffffff" },
    { url = "*/", fg = "#ffffff" },
]

# : ]]]
